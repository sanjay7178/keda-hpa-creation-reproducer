apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-load-{{ .Iteration }}
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.37.0
          command: ["sh", "-ceu", "until nc -z rabbitmq 5672; do sleep 1; done"]
      containers:
        - name: load
          image: pivotalrabbitmq/perf-test:2.25.0
          imagePullPolicy: IfNotPresent
          args:
            - --uri
            - amqp://keda:keda@rabbitmq:5672/
            - --queue
            - keda-comparison-{{ .Iteration }}
            - --producers
            - "1"
            - --consumers
            - "0"
            - --pmessages
            - "{{ .messageCount }}"
            - --auto-delete
            - "false"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
