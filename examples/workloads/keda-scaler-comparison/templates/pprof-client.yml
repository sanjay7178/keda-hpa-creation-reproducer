apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-burner-pprof-client
  labels:
    app: kube-burner-pprof-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-burner-pprof-client
  template:
    metadata:
      labels:
        app: kube-burner-pprof-client
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.16.0
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
