apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-load
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: producer
          image: apache/kafka:4.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do sleep 2; done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic keda-comparison --partitions 16 --replication-factor 1
              seq 1 {{ .messageCount }} | /opt/kafka/bin/kafka-console-producer.sh --bootstrap-server kafka:9092 --topic keda-comparison
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
