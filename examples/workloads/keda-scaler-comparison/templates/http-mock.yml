apiVersion: v1
kind: ConfigMap
metadata:
  name: scaler-http-mock
data:
  server.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    value = float(os.environ["SIGNAL_VALUE"])
    if value.is_integer():
        value = int(value)

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def response(self):
            if self.path == "/metrics":
                return {"components": {"worker": {"tasks": value}}}
            return {"hits": {"total": {"value": value, "relation": "eq"}}}

        def send_response_body(self, include_body=True):
            body = json.dumps(self.response()).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            if include_body:
                self.wfile.write(body)

        def do_HEAD(self):
            self.send_response_body(False)

        def do_GET(self):
            self.send_response_body()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", "0"))
            if length:
                self.rfile.read(length)
            self.send_response_body()

        def log_message(self, *_):
            pass

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaler-http-mock
spec:
  replicas: {{ .mockReplicas }}
  selector:
    matchLabels:
      app: scaler-http-mock
  template:
    metadata:
      labels:
        app: scaler-http-mock
    spec:
      containers:
        - name: mock
          image: python:3.13.7-alpine3.22
          imagePullPolicy: IfNotPresent
          command: [python3, /app/server.py]
          env:
            - name: SIGNAL_VALUE
              value: {{ .signalValue | quote }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: "1"
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: scaler-http-mock
---
apiVersion: v1
kind: Service
metadata:
  name: mock-http
spec:
  selector:
    app: scaler-http-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
